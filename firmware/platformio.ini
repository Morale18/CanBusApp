; ESP32 OBD-II → BLE bridge
; Open this folder (firmware/) as the PlatformIO project root.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    coryjfowler/mcp_can@^1.5.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

build_unflags =
    -std=gnu++11
